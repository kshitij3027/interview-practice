<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ServiceClock — Work Orders</title><link rel="stylesheet" href="/styles.css"></head>
<body><header><div><span class="eyebrow">FIELD SERVICE / DISPATCH</span><h1>ServiceClock</h1></div><span id="connection" class="tag">Local demo</span></header>
<main><section class="panel" aria-label="Work order list"><h2>Work orders</h2><label>Customer account<select id="account"></select></label><div class="filters"><input id="search" placeholder="Search work orders" aria-label="Search"><select id="status" aria-label="Status"><option value="">All states</option><option value="in_progress">In progress</option><option value="waiting_customer">Waiting customer</option><option value="resolved">Resolved</option></select></div><p id="list-message" class="muted">Loading…</p><div id="jobs" class="jobs"></div></section>
<section class="panel details"><h2>Work order</h2><div id="detail-message" class="muted">Select a work order.</div><article id="detail" hidden><div class="row"><h3 id="job-name"></h3><span class="tag" id="job-status"></span></div><p class="muted" id="job-meta"></p><div class="info" id="job-summary"></div><p><b>Site</b><span id="site-info"></span></p><p><b>Opened</b><span id="opened"></span></p><p><b>Priority</b><span id="priority"></span></p><div class="note-box"><label for="note">Internal dispatch note</label><textarea id="note" rows="3" maxlength="500"></textarea><button id="save-note">Save note</button><p class="muted" id="note-message"></p></div></article></section></main>
<footer>Fixture-backed demo · Changes reset on restart</footer><script type="module" src="/app.js"></script></body></html>
