<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CycleLedger · Contract Console</title><link rel="stylesheet" href="/styles.css"></head>
<body><header><h1>CycleLedger</h1><span>Contract operations</span></header><main><section class="directory"><div class="toolbar"><label>Organization <select id="org"></select></label><label>Search <input id="search" placeholder="Customer or contract ID"></label><label>Status <select id="status"><option value="">All</option><option>active</option><option>paused</option><option>ended</option></select></label></div><p id="count"></p><div id="list" aria-live="polite"></div><div class="paging"><button id="previous">Previous</button><span id="page"></span><button id="next">Next</button></div></section><section class="detail"><h2>Contract detail</h2><div id="details">Select a contract.</div><form id="notes" hidden><label>Internal note <textarea id="note" rows="4" maxlength="2000"></textarea></label><button type="submit">Save note</button></form><p id="message" role="status"></p></section></main><script src="/app.js" type="module"></script></body></html>
