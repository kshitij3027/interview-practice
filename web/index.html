<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CaseFold | Support cases</title><link rel="stylesheet" href="/styles.css"></head><body>
<header><h1>CaseFold</h1><span>Customer support operations</span></header>
<main><section class="directory"><h2>Case directory</h2><div class="filters"><label>Organization <select id="org"></select></label><label>Search <input id="query" type="search" placeholder="Case ID or subject"></label><label>Status <select id="status"><option value="all">All</option><option>open</option><option>pending</option><option>resolved</option></select></label></div><p id="listMessage" role="status"></p><div id="cases"></div><div class="pager"><button id="prev">Previous</button><span id="pageInfo"></span><button id="next">Next</button></div></section><section class="detail"><h2>Case detail</h2><p id="detailMessage" role="status">Select a case.</p><div id="detail"></div></section></main>
<script type="module" src="/app.js"></script></body></html>
