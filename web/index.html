<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FulfillFlow</title><link rel="stylesheet" href="styles.css"></head><body>
<header><div><h1>FulfillFlow</h1><p>Inventory & pending orders</p></div><div id="status"></div></header>
<main><section class="panel orders"><h2>Orders</h2><div id="orders"></div></section><section class="panel"><div id="order-detail"></div></section><section class="panel inventory"><div class="row"><h2>Inventory</h2><input id="filter" placeholder="Filter SKU"></div><table><thead><tr><th>SKU</th><th>Warehouse</th><th>On hand</th><th>Reserved</th><th>Available</th></tr></thead><tbody id="inventory-body"></tbody></table></section><section class="panel"><h2>Manual stock adjustment</h2><form id="adjust-form"><input name="warehouse_id" placeholder="wh-b" required><input name="sku" placeholder="SKU-RED" required><input name="delta" type="number" placeholder="Delta" required><input name="reason" placeholder="Reason" required><button>Apply adjustment</button></form></section></main>
<script type="module" src="app.js"></script></body></html>
